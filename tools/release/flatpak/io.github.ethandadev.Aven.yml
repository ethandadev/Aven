# Aven as a Flatpak (Aven-<version>-linux.flatpak), made from the Linux release folder.
# The release workflow copies that folder to ./aven next to this file (and resources/icon/aven_512.png),
# then runs flatpak-builder:
#
#   flatpak-builder --user --install-deps-from=flathub --repo=repo build io.github.ethandadev.Aven.yml
#   flatpak build-bundle repo Aven.flatpak io.github.ethandadev.Aven
#
# Flatpak installs are read-only, so the editor's updater points at the release page instead of
# replacing files.
app-id: io.github.ethandadev.Aven
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: aven-editor
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=input          # gamepads
  - --socket=pulseaudio
  - --share=network         # LAN multiplayer, sharing on Wi-Fi, update checks
  - --filesystem=home       # games are folders you pick anywhere in your home folder
modules:
  - name: aven
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/aven /app/bin
      - cp -a aven/. /app/lib/aven/
      - ln -s ../lib/aven/aven-editor /app/bin/aven-editor
      - install -Dm644 aven_512.png /app/share/icons/hicolor/512x512/apps/io.github.ethandadev.Aven.png
      - install -Dm644 io.github.ethandadev.Aven.desktop /app/share/applications/io.github.ethandadev.Aven.desktop
      - install -Dm644 io.github.ethandadev.Aven.metainfo.xml /app/share/metainfo/io.github.ethandadev.Aven.metainfo.xml
    sources:
      - type: dir
        path: aven
        dest: aven
      - type: file
        path: aven_512.png  # copied here by the workflow, from resources/icon
      - type: file
        path: io.github.ethandadev.Aven.desktop
      - type: file
        path: io.github.ethandadev.Aven.metainfo.xml
