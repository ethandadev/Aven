# Rynax as a Flatpak (Rynax-<version>-linux.flatpak), made from the Linux release folder.
# The release workflow copies that folder to ./rynax next to this file (and resources/icon/rynax_512.png),
# then runs flatpak-builder:
#
#   flatpak-builder --user --install-deps-from=flathub --repo=repo build io.github.ethandadev.Rynax.yml
#   flatpak build-bundle repo Rynax.flatpak io.github.ethandadev.Rynax
#
# Flatpak installs are read-only, so the editor's updater points at the release page instead of
# replacing files.
app-id: io.github.ethandadev.Rynax
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: rynax-editor
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=input          # gamepads
  - --socket=pulseaudio
  - --share=network         # LAN multiplayer, sharing on Wi-Fi, update checks
  - --filesystem=home       # games are folders you pick anywhere in your home folder
modules:
  - name: rynax
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/rynax /app/bin
      - cp -a rynax/. /app/lib/rynax/
      - ln -s ../lib/rynax/rynax-editor /app/bin/rynax-editor
      - install -Dm644 rynax_512.png /app/share/icons/hicolor/512x512/apps/io.github.ethandadev.Rynax.png
      - install -Dm644 io.github.ethandadev.Rynax.desktop /app/share/applications/io.github.ethandadev.Rynax.desktop
      - install -Dm644 io.github.ethandadev.Rynax.metainfo.xml /app/share/metainfo/io.github.ethandadev.Rynax.metainfo.xml
    sources:
      - type: dir
        path: rynax
        dest: rynax
      - type: file
        path: rynax_512.png  # copied here by the workflow, from resources/icon
      - type: file
        path: io.github.ethandadev.Rynax.desktop
      - type: file
        path: io.github.ethandadev.Rynax.metainfo.xml
