<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="card.png">
<link rel="icon" href="icon.png">
<style>
  :root { --accent: {{ACCENT}}; }
  html, body { margin: 0; height: 100%; background: #0b1020; color: #e8ecf6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: {{ASPECT}}; width: min(100vw, calc(100vh * {{ASPECT}})); height: auto; outline: none; background: #000; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
           background: radial-gradient(ellipse at top, #1e293b 0%, #0b1020 70%); text-align: center; padding: 24px; }
  #cover img { max-width: min(560px, 90vw); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #cover h1 { margin: 6px 0 0; font-size: clamp(28px, 5vw, 46px); }
  #cover p { margin: 0; max-width: 560px; color: #aab4c8; line-height: 1.45; }
  #controls { font-size: 14px; color: #cbd5e1; }
  #play { font-size: 22px; font-weight: 700; padding: 14px 44px; border: 0; border-radius: 999px; background: var(--accent); color: white; cursor: pointer; }
  #play:disabled { opacity: .5; cursor: default; }
  #bar { width: min(320px, 70vw); height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #made { position: fixed; bottom: 12px; right: 16px; font-size: 12px; color: #64748b; }
  #made a { color: inherit; }
  #full { position: fixed; top: 12px; right: 12px; display: none; background: rgba(15,23,42,.7); color: #e2e8f0; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  #error { color: #fca5a5; white-space: pre-wrap; max-width: 640px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="cover">
  <img id="shot" src="card.png" alt="" onerror="this.remove()">
  <h1>{{TITLE}}</h1>
  <p>{{DESCRIPTION}}</p>
  <div id="controls">{{CONTROLS}}</div>
  <button id="play" disabled>Loading...</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="error"></div>
</div>
<button id="full" title="Full screen">Full screen</button>
<div id="made">Made with <a href="https://github.com/ethandadev/Aven" target="_blank" rel="noopener">Aven</a></div>
<script>
(function () {
  const files = {};
  const play = document.getElementById('play');
  const fill = document.getElementById('fill');
  const error = document.getElementById('error');

  // 1. Download the game's files while the cover shows.
  fetch('game/files.json').then(r => r.json()).then(async list => {
    let done = 0;
    await Promise.all(list.files.map(async name => {
      const r = await fetch('game/' + name.split('/').map(encodeURIComponent).join('/'));
      if (!r.ok) throw new Error('Missing ' + name);
      files[name] = new Uint8Array(await r.arrayBuffer());
      fill.style.width = (100 * ++done / list.files.length) + '%';
    }));
    play.disabled = false;
    play.textContent = 'Play';
    play.focus();
  }).catch(e => { error.textContent = 'The game could not load: ' + e.message + '\nIf you opened index.html from your disk, put it on a web server instead (browsers block games opened as files).'; });

  // 2. Start on click (browsers only allow sound after a click).
  function start() {
    play.disabled = true;
    play.textContent = 'Starting...';
    window.Module = {
      canvas: document.getElementById('canvas'),
      arguments: [],
      preRun: [function () {
        const FS = Module.FS;
        FS.mkdir('/game');
        for (const [name, data] of Object.entries(files)) {
          const parts = name.split('/');
          let dir = '/game';
          for (const p of parts.slice(0, -1)) { dir += '/' + p; try { FS.mkdir(dir); } catch (e) {} }
          FS.writeFile('/game/' + name, data);
        }
      }],
      onRuntimeInitialized: function () {
        document.getElementById('cover').remove();
        document.getElementById('made').remove(); // it would sit on top of the game
        document.getElementById('full').style.display = 'block';
        Module.canvas.focus();
      },
      print: t => console.log(t),
      printErr: t => { console.warn(t); if (/\[error\]/.test(t)) error.textContent = t; },
    };
    const s = document.createElement('script');
    s.src = 'aven-player.js';
    s.onerror = () => { error.textContent = 'aven-player.js is missing next to index.html.'; };
    document.body.appendChild(s);
  }
  play.addEventListener('click', start);
  document.getElementById('full').addEventListener('click', () => document.getElementById('canvas').requestFullscreen());
  // Arrow keys and space move the player, not the page.
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
