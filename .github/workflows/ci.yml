name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb libgl1-mesa-dri

      - name: Cache downloaded libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/AvenDependencies.cmake') }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then generator="-G Ninja"; fi
          cmake -S . -B build $generator -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          tests=$(find build -name 'aven_tests' -o -name 'aven_tests.exe' | head -n 1)
          "$tests"

      - name: Check every template (aven-editor --check)
        if: runner.os == 'Linux'
        run: |
          for t in templates/*/; do build/bin/aven-editor "$t" --check --strict; done

      - name: Editor smoke test (screenshot)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" build/bin/aven-editor templates/platformer --screenshot editor.png --frames 20
          xvfb-run -a -s "-screen 0 1920x1080x24" build/bin/aven-player templates/obby-3d --screenshot player.png --frames 30 --hidden

      - name: Editor interaction tests (recorded mouse and keyboard input)
        if: runner.os == 'Linux'
        run: python3 tests/editor/run.py build/bin/aven-editor

      - name: Package as Aven.app and start it (macOS)
        if: runner.os == 'macOS'
        run: |
          tools/release/package.sh build/bin aven-ci-macos-arm64 "" dist
          tools/release/make_mac_app.sh dist/aven-ci-macos-arm64 0.0.0-ci dist/mac
          ditto -x -k dist/mac/aven-0.0.0-ci-macos-arm64.zip dist/unzipped
          # Hide the source folders, so the app can only use what's inside it (Contents/Resources).
          mv editor/data editor/data.hidden && mv templates templates.hidden && mv quests quests.hidden && mv sdk sdk.hidden
          app=dist/unzipped/Aven.app
          # (GitHub's Mac runners have no GPU for an OpenGL window, so no screenshot here.)
          "$app/Contents/MacOS/aven-editor" "$PWD/$app/Contents/Resources/templates/platformer" --check --strict
          mv editor/data.hidden editor/data && mv templates.hidden templates && mv quests.hidden quests && mv sdk.hidden sdk
          codesign --verify --deep --strict "$app"

      - name: Upload screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: |
            editor.png
            player.png

  sanitizers:
    # Memory errors and undefined behavior in the VM, parsers, physics glue...: every test runs
    # under AddressSanitizer (with leak checking) and UndefinedBehaviorSanitizer. (vptr checks are
    # off: Jolt is built without RTTI.)
    name: Sanitizers (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Cache downloaded libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: deps-sanitizers-${{ hashFiles('cmake/AvenDependencies.cmake') }}
      - name: Configure
        run: |
          flags="-fsanitize=address,undefined -fno-sanitize=vptr -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" -DCMAKE_SHARED_LINKER_FLAGS="$flags"
      - name: Build the tests
        run: cmake --build build --target aven_tests aven_test_module --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          AVEN_FUZZ_ROUNDS: "3000"
          UBSAN_OPTIONS: print_stacktrace=1
        run: build/bin/aven_tests

  web:
    name: Web player
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the web player
        run: tools/web/build_web_player.sh web-player
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-player
          path: web-player
