name: Release

# Push a tag like v0.2.0 to build Aven for Windows, macOS and Linux and publish a GitHub
# release with the downloads. Tags with a dash (v0.2.0-beta.1) become pre-releases.
# "Run workflow" on the Actions tab builds the same zips without publishing (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (dry run: the zips are uploaded to the run, no release is made)"
        required: true
        default: "0.0.0-test"

# Read-only everywhere; only the publish job (which runs no third-party code before it uploads) can
# write releases. Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
permissions:
  contents: read

jobs:
  web:
    name: Web player
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the web player
        run: tools/web/build_web_player.sh web-player
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-player
          path: web-player

  desktop:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            suffix: linux-x64
            bin: build/bin
          - name: Windows
            os: windows-latest
            suffix: windows-x64
            bin: build/bin/Release
          - name: macOS
            os: macos-latest
            suffix: macos-arm64
            bin: build/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PACKAGE=aven-$v-${{ matrix.suffix }}" >> "$GITHUB_ENV"
          echo "Building Aven $v"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb libgl1-mesa-dri

      - name: Cache downloaded libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/AvenDependencies.cmake') }}

      - name: Configure
        shell: bash
        env:
          # The public half of the update signing key (tools/release/update_key.py). Not secret.
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then generator="-G Ninja"; fi
          if [ -n "$UPDATE_PUBLIC_KEY" ] && ! [[ "$UPDATE_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The UPDATE_PUBLIC_KEY variable should be 64 lowercase hex digits."; exit 1
          fi
          if [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::No UPDATE_PUBLIC_KEY variable: this build won't install updates itself (docs/releasing.md)."
          fi
          # Release builds leave out the test hooks (AVEN_UPDATE_URL and friends).
          cmake -S . -B build $generator -DCMAKE_BUILD_TYPE=Release -DAVEN_VERSION="$VERSION" \
            -DAVEN_TEST_HOOKS=OFF -DAVEN_UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          tests=$(find build -name 'aven_tests' -o -name 'aven_tests.exe' | head -n 1)
          "$tests"

      - name: Get the web player
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-player
          path: web-player

      - name: Package
        shell: bash
        run: tools/release/package.sh "${{ matrix.bin }}" "$PACKAGE" web-player dist

      - name: Add the Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Copied next to the programs, so Aven runs on PCs without the Visual C++ Redistributable.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dlls = & $vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll"
          if (-not $dlls) { throw "Couldn't find the Visual C++ runtime DLLs." }
          $stage = "dist\$env:PACKAGE"
          Copy-Item $dlls $stage

      - name: Check the download works on its own
        if: runner.os == 'Linux'
        run: |
          # Unzip somewhere else and hide the source folders, so the editor can only use what's in the zip.
          mkdir -p /tmp/try && cd /tmp/try && unzip -q "$GITHUB_WORKSPACE/dist/$PACKAGE.zip"
          cd "$GITHUB_WORKSPACE" && mv editor/data editor/data.hidden && mv sdk sdk.hidden && mv quests quests.hidden && mv templates templates.hidden
          app="/tmp/try/$PACKAGE"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$app/aven-editor" --screenshot hub.png --frames 20 2>&1 | tee editor.log
          xvfb-run -a -s "-screen 0 1920x1080x24" "$app/aven-editor" "$app/templates/platformer" --screenshot editor.png --frames 20 2>&1 | tee -a editor.log
          xvfb-run -a -s "-screen 0 1280x720x24" "$app/aven-player" "$app/templates/platformer" --screenshot player.png --frames 30 --hidden 2>&1 | tee player.log
          test -s hub.png && test -s editor.png && test -s player.png
          grep -q "Aven Editor $VERSION" editor.log
          if grep -h "\[error\]" editor.log player.log; then echo "The packaged build logged errors."; exit 1; fi

      - name: Upload screenshots of the packaged build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-screenshots
          path: |
            hub.png
            editor.png
            player.png

      # For the bundle job: this system's download, and its player (with the Windows runtime DLLs),
      # as tar files, which keep the programs' permissions (artifacts on their own don't).
      - name: Keep the download and the player
        shell: bash
        run: |
          mkdir -p "players/${{ matrix.suffix }}"
          for f in aven-player aven-player.exe; do
            if [ -e "dist/$PACKAGE/$f" ]; then cp "dist/$PACKAGE/$f" "players/${{ matrix.suffix }}/"; fi
          done
          for f in dist/$PACKAGE/*.dll; do if [ -e "$f" ]; then cp "$f" "players/${{ matrix.suffix }}/"; fi; done
          tar -cf "stage-${{ matrix.suffix }}.tar" -C dist "$PACKAGE"
          tar -cf "player-${{ matrix.suffix }}.tar" -C players "${{ matrix.suffix }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-${{ matrix.suffix }}
          path: stage-${{ matrix.suffix }}.tar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-${{ matrix.suffix }}
          path: player-${{ matrix.suffix }}.tar

  # Every download gets every system's player in players/, so Build & Share can make Windows, macOS
  # and Linux apps from any of them. Each system's folder goes on to its packaging job as a tar
  # (which keeps the programs runnable); the Linux zip is made here.
  bundle:
    name: Bundle the downloads
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*64"
          path: parts
          merge-multiple: true
      - name: Add every system's player to every download
        run: |
          mkdir -p players dist out
          for p in parts/player-*.tar; do tar -xf "$p" -C players; done
          for s in parts/stage-*.tar; do tar -xf "$s" -C dist; done
          cd dist
          for pkg in */; do
            pkg="${pkg%/}"
            mkdir -p "$pkg/players"
            for sys in ../players/*; do cp -R "$sys" "$pkg/players/$(basename "$sys")"; done
            ls -R "$pkg/players" | head -n 30
            for sys in windows-x64 macos-arm64 linux-x64; do
              case "$pkg" in *-"$sys") tar -cf "../out/bundled-$sys.tar" "$pkg" ;; esac
            done
          done
          for pkg in *-linux-x64; do
            zip -qry "../out/$pkg.zip" "$pkg" # -y and zip's Unix attributes keep the programs runnable
          done
          ls -la ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundled
          path: out/bundled-*.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-zip
          path: out/*.zip

  # Windows: the zip (what the updater downloads) and the installer, both signed when a certificate
  # is set up (docs/releasing.md): Azure Trusted Signing, or a .pfx file.
  windows:
    name: Windows installer
    needs: bundle
    runs-on: windows-latest
    env:
      # Only whether signing is set up; the secrets themselves go to the signing steps alone.
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_PFX: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundled
          path: parts
      - name: Unpack
        shell: bash
        run: |
          mkdir -p stage out
          tar -xf parts/bundled-windows-x64.tar -C stage
          pkg="$(ls stage)"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "VERSION=$(echo "$pkg" | sed -E 's/^aven-(.*)-windows-x64$/\1/')" >> "$GITHUB_ENV"
      - name: Sign the programs (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: stage/${{ env.PKG }}
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the programs (.pfx certificate)
        if: env.HAS_AZURE != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $files = Get-ChildItem "stage\$env:PKG" -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -Append $env:GITHUB_ENV
          "PFX=$pfx" | Out-File -Append $env:GITHUB_ENV
      - name: Zip
        shell: bash
        run: cd stage && 7z a -tzip -mx=9 "../out/$PKG.zip" "$PKG" > /dev/null
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $numeric = $env:VERSION.Split('-')[0]
          & $iscc "/DVersion=$env:VERSION" "/DNumericVersion=$numeric" "/DSource=$pwd\stage\$env:PKG" "/DOutput=$pwd\out" tools\release\windows\aven.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Sign the installer (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign the installer (.pfx certificate)
        if: env.HAS_AZURE != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem out\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: Check the installer installs
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\*-Setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "AvenInstall"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          foreach ($f in "aven-editor.exe", "aven-player.exe", "START HERE.txt", "templates\platformer\project.aven", "players\macos-arm64\aven-player") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "The installer didn't install $f" }
          }
          Get-ChildItem out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: out/*

  # macOS: Aven.app, in a .dmg to drag into Applications and a zip for the updater. Signed with a
  # Developer ID and notarized when those secrets are set (docs/releasing.md), ad-hoc signed if not.
  macos:
    name: macOS app
    needs: bundle
    runs-on: macos-latest
    env:
      # Only whether signing is set up; the secrets themselves go to the steps that use them.
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundled
          path: parts
      - name: Unpack
        run: |
          mkdir -p stage out
          tar -xf parts/bundled-macos-arm64.tar -C stage
          pkg="$(ls stage)"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "VERSION=$(echo "$pkg" | sed -E 's/^aven-(.*)-macos-arm64$/\1/')" >> "$GITHUB_ENV"
      - name: Load the signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$identity" ]; then echo "No 'Developer ID Application' certificate in MACOS_CERTIFICATE." >&2; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api_key.p8" >> "$GITHUB_ENV"
          fi
      - name: Make Aven.app, the zip and the installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tools/release/make_mac_app.sh "stage/$PKG" "$VERSION" out
      - name: Check the app
        run: |
          hdiutil attach out/*.dmg -mountpoint /tmp/aven-dmg -nobrowse
          app=/tmp/aven-dmg/Aven.app
          test -x "$app/Contents/MacOS/aven-editor" && test -d "$app/Contents/Resources/templates/platformer"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app" || echo "(Gatekeeper accepts it only when it's signed and notarized)"
          "$app/Contents/MacOS/aven-editor" --help > /dev/null
          hdiutil detach /tmp/aven-dmg
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: out/*

  # Linux: a Flatpak made from the Linux download.
  flatpak:
    name: Flatpak
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08@sha256:66eb59fd5d923833e8e4142f60e542156aad4b8b1d5db38149d814c659e274bc
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundled
          path: parts
      - name: Unpack
        run: |
          mkdir -p stage
          tar -xf parts/bundled-linux-x64.tar -C stage
          pkg="$(ls stage)"
          echo "VERSION=$(echo "$pkg" | sed -E 's/^aven-(.*)-linux-x64$/\1/')" >> "$GITHUB_ENV"
          # Only this system's player: a Flatpak runs on Linux (and exports for other systems use players/).
          cp -a "stage/$pkg" tools/release/flatpak/aven
          cp resources/icon/aven_512.png tools/release/flatpak/
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2026-09
        with:
          bundle: Aven-${{ env.VERSION }}-linux.flatpak
          manifest-path: tools/release/flatpak/io.github.ethandadev.Aven.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-flatpak
          path: Aven-*.flatpak

  # Signs what the editor's updater downloads (the three zips) with the release key. Its own job, so
  # the key is only ever next to this repository's script and GitHub's own artifact actions.
  sign-updates:
    name: Sign the updates
    needs: [bundle, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p sigs
          zips=$(ls dist/aven-*-windows-x64.zip dist/aven-*-macos-arm64.zip dist/aven-*-linux-x64.zip)
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ -n "$UPDATE_PUBLIC_KEY" ]; then
              echo "::error::UPDATE_PUBLIC_KEY is set but the UPDATE_SIGNING_KEY secret isn't: editors would refuse this release."
              exit 1
            fi
            echo "::warning::No UPDATE_SIGNING_KEY secret: the downloads aren't signed, so editors won't install them as updates."
            exit 0
          fi
          python3 tools/release/update_key.py sign $zips
          # The signatures must check out with the key built into the editor.
          python3 tools/release/update_key.py verify "$UPDATE_PUBLIC_KEY" $zips
          mv dist/*.sig sigs/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signatures
          path: sigs/*.sig
          if-no-files-found: ignore

  publish:
    name: Publish the release
    needs: [bundle, windows, macos, flatpak, sign-updates]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the only job that can change the repository's releases
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          ls -la dist
          v="${GITHUB_REF_NAME#v}"
          # The "## <version>" section, up to the next "## " heading.
          awk -v v="$v" '/^## / { on = ($2 == v); next } on' src/CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "::warning::CHANGELOG.md has no '## $v' section, so the release has no notes."
          fi
          # The editor's Update window shows the notes above this line.
          cat >> body.md <<EOF

          <!-- aven:download -->
          ## Download

          | | Install | Or unzip and run |
          |---|---|---|
          | Windows | [Aven-$v-Setup.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Aven-$v-Setup.exe) | \`aven-$v-windows-x64.zip\` |
          | macOS (Apple silicon) | [Aven-$v-macOS.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Aven-$v-macOS.dmg): drag Aven into Applications | \`aven-$v-macos-arm64.zip\` |
          | Linux | [Aven-$v-linux.flatpak](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Aven-$v-linux.flatpak): \`flatpak install Aven-$v-linux.flatpak\` | \`aven-$v-linux-x64.zip\` |

